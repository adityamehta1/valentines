<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine? 💘</title>
  <style>
    :root{
      --bg1:#ffe6f0;
      --bg2:#fff7fb;
      --pink:#ff4d8d;
      --pink2:#ff2f78;
      --text:#2b2b2b;
      --card: rgba(255,255,255,0.78);
      --line: rgba(255, 77, 141, 0.18);
      --bear:#d7b08b;
      --bear2:#cfa37c;
      --muzzle:#f2d7bf;
      --cheek:#ff86ad;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, var(--bg2), var(--bg1));
      overflow:hidden;
    }

    .card{
      width:min(760px, 94vw);
      padding: clamp(22px, 4vw, 36px);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      backdrop-filter: blur(10px);
      position: relative;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(26px, 4vw, 44px);
      letter-spacing: -0.02em;
      text-align:center;
    }
    p{
      margin:0 0 18px;
      text-align:center;
      font-size: clamp(14px, 2vw, 18px);
      opacity:0.85;
    }

    .stage{
      position: relative;
      height: 300px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.70), rgba(255,255,255,0.35));
      border: 1px solid var(--line);
      overflow:hidden;
      display:grid;
      place-items:center;
    }

    .question{
      position:absolute;
      inset: 18px 18px auto 18px;
      text-align:center;
      font-weight:800;
      font-size: clamp(22px, 3vw, 36px);
    }

    /* Button row */
    .btnRow{
      position:absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      display:flex;
      justify-content:center;
      gap: 14px;
      padding: 0 16px;
      transition: opacity .25s ease;
    }

    button{
      border:0;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 16px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    button:active{ transform: scale(0.98); }

    #yesBtn{
      background: linear-gradient(180deg, var(--pink), var(--pink2));
      color: white;
    }
    #yesBtn:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(255,47,120,0.25);
    }

    /* The runner "No" button is NOT in the flex row; it's free-floating in the stage */
    #noBtn{
      background: white;
      color: #333;
      border: 1px solid rgba(0,0,0,0.08);
      position:absolute;
      left: 56%;
      top: 210px;
    }

    .message{
      margin-top: 16px;
      text-align:center;
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 900;
      color: var(--pink2);
      min-height: 1.6em;
    }

    /* Cute bears */
    .bears{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 40px;
      pointer-events:none;
      opacity:0;
      transform: translateY(18px) scale(0.98);
      transition: opacity .35s ease, transform .35s ease;
    }
    .bears.show{
      opacity:1;
      transform: translateY(0) scale(1);
    }

    .bear{
      width: 160px;
      height: 160px;
      position: relative;
      transition: transform .55s cubic-bezier(.2,.9,.2,1);
      filter: drop-shadow(0 18px 22px rgba(0,0,0,0.10));
    }

    .bear .head{
      position:absolute;
      inset: 22px 14px 10px 14px;
      border-radius: 50%;
      background: radial-gradient(60px 60px at 40% 30%, #e6c3a0, var(--bear));
      box-shadow: inset 0 -12px 0 rgba(0,0,0,0.06);
    }
    .bear .ear{
      position:absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(24px 24px at 40% 35%, #e6c3a0, var(--bear));
      top: 6px;
      box-shadow: inset 0 -7px 0 rgba(0,0,0,0.06);
    }
    .bear .ear::after{
      content:"";
      position:absolute;
      inset: 14px;
      border-radius:50%;
      background:#f6e2d0;
      opacity:0.9;
    }
    .bear .ear.left{ left: 12px; }
    .bear .ear.right{ right: 12px; }

    .bear .face{
      position:absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      width: 106px;
      height: 82px;
      border-radius: 44px;
      background: radial-gradient(55px 45px at 50% 35%, #fff1e6, var(--muzzle));
      box-shadow: inset 0 -7px 0 rgba(0,0,0,0.05);
    }

    .bear .eye{
      position:absolute;
      width: 14px;
      height: 18px;
      border-radius: 10px;
      background:#1f1f1f;
      top: 22px;
    }
    .bear .eye::after{
      content:"";
      position:absolute;
      width: 6px;
      height: 6px;
      border-radius:50%;
      background: #fff;
      left: 3px;
      top: 3px;
      opacity:0.9;
    }
    .bear .eye.left{ left: 26px; }
    .bear .eye.right{ right: 26px; }

    .bear .cheek{
      position:absolute;
      width: 18px;
      height: 12px;
      border-radius: 999px;
      background: var(--cheek);
      top: 46px;
      opacity:0.6;
      filter: blur(0.2px);
    }
    .bear .cheek.left{ left: 18px; }
    .bear .cheek.right{ right: 18px; }

    .bear .snout{
      position:absolute;
      left:50%;
      top: 40px;
      transform: translateX(-50%);
      width: 34px;
      height: 26px;
      border-radius: 14px;
      background:#deb493;
    }

    .bear .nose{
      position:absolute;
      left:50%;
      top: 44px;
      transform: translateX(-50%);
      width: 16px;
      height: 12px;
      border-radius: 10px;
      background:#1f1f1f;
    }

    .bear .mouth{
      position:absolute;
      left:50%;
      top: 56px;
      transform: translateX(-50%);
      width: 34px;
      height: 16px;
    }
    .bear .mouth::before,
    .bear .mouth::after{
      content:"";
      position:absolute;
      width: 16px;
      height: 10px;
      border: 2px solid #1f1f1f;
      border-top: 0;
      border-left: 0;
      border-radius: 0 0 12px 0;
      top: 2px;
      opacity:0.9;
    }
    .bear .mouth::before{ left: 2px; transform: scaleX(-1); }
    .bear .mouth::after{ right: 2px; }

    /* Kiss heart */
    .heart{
      position:absolute;
      left:50%;
      top: 52%;
      transform: translate(-50%,-50%) rotate(45deg) scale(0);
      width: 26px;
      height: 26px;
      background: var(--pink);
      opacity:0;
    }
    .heart::before,
    .heart::after{
      content:"";
      position:absolute;
      width: 26px;
      height: 26px;
      border-radius:50%;
      background: var(--pink);
      top: -13px;
    }
    .heart::before{ left: 0; }
    .heart::after{ left: 13px; top: 0; }

    .kiss .bear.left { transform: translateX(30px) rotate(-3deg); }
    .kiss .bear.right { transform: translateX(-30px) rotate(3deg); }

    .kiss .heart{ animation: pop 1.1s ease forwards; }

    @keyframes pop{
      0%   { transform: translate(-50%,-50%) rotate(45deg) scale(0); opacity:0; }
      18%  { transform: translate(-50%,-60%) rotate(45deg) scale(1.15); opacity:1; }
      55%  { transform: translate(-50%,-90%) rotate(45deg) scale(1.05); opacity:1; }
      100% { transform: translate(-50%,-130%) rotate(45deg) scale(0.95); opacity:0; }
    }

    /* Floating hearts */
    .floaters{ position:fixed; inset:0; pointer-events:none; opacity:0.7; }
    .floater{
      position:absolute;
      font-size: 18px;
      animation: drift linear infinite;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.10));
    }
    @keyframes drift{
      from { transform: translateY(120vh) translateX(0); }
      to   { transform: translateY(-20vh) translateX(40px); }
    }
  </style>
</head>

<body>
  <div class="floaters" aria-hidden="true" id="floaters"></div>

  <div class="card">
    <div class="stage" id="stage">
      <div class="question" id="question">Will you be my Valentine? 💘</div>

      <div class="bears" id="bears">
        <div class="bear left">
          <div class="ear left"></div><div class="ear right"></div>
          <div class="head"></div>
          <div class="face">
            <div class="eye left"></div><div class="eye right"></div>
            <div class="cheek left"></div><div class="cheek right"></div>
            <div class="snout"></div><div class="nose"></div><div class="mouth"></div>
          </div>
        </div>

        <div class="heart" id="heart"></div>

        <div class="bear right">
          <div class="ear left"></div><div class="ear right"></div>
          <div class="head"></div>
          <div class="face">
            <div class="eye left"></div><div class="eye right"></div>
            <div class="cheek left"></div><div class="cheek right"></div>
            <div class="snout"></div><div class="nose"></div><div class="mouth"></div>
          </div>
        </div>
      </div>

      <!-- Yes button stays in a row at the bottom -->
      <div class="btnRow" id="btnRow">
        <button id="yesBtn">Yes 💖</button>
      </div>

      <!-- No button is free-floating so it can dodge correctly -->
      <button id="noBtn">No 🙃</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn  = document.getElementById('noBtn');
    const bears  = document.getElementById('bears');
    const btnRow = document.getElementById('btnRow');
    const msg    = document.getElementById('message');

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    // Move "No" somewhere inside the stage (never off-screen)
    function moveNoButton() {
      const stageRect = stage.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const pad = 14;
      const minX = pad;
      const minY = 92;                 // keep it below the question
      const maxX = stageRect.width - btnRect.width - pad;
      const maxY = stageRect.height - btnRect.height - 70; // keep it above bottom-ish

      const x = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      const y = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
    }

    // Make it dodge on hover and also when cursor gets close
    noBtn.addEventListener('mouseenter', moveNoButton);

    stage.addEventListener('mousemove', (e) => {
      const stageRect = stage.getBoundingClientRect();
      const bx = e.clientX - stageRect.left;
      const by = e.clientY - stageRect.top;

      const nb = noBtn.getBoundingClientRect();
      const nx = (nb.left - stageRect.left) + nb.width/2;
      const ny = (nb.top  - stageRect.top)  + nb.height/2;

      const dist = Math.hypot(bx - nx, by - ny);

      // If cursor is within 90px of the No button, it runs away
      if (dist < 90) moveNoButton();
    });

    // Mobile: tap/approach makes it jump
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    // YES: show bears, kiss, show message
    yesBtn.addEventListener('click', () => {
      msg.textContent = "I love you baby 💞";
      bears.classList.add('show');
      stage.classList.add('kiss');

      btnRow.style.opacity = '0';
      btnRow.style.pointerEvents = 'none';
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';

      // re-trigger heart animation if needed
      const heart = document.getElementById('heart');
      heart.style.animation = 'none';
      void heart.offsetWidth;
      heart.style.animation = '';
    });

    // Start "No" at a sensible spot
    moveNoButton();

    // Floating hearts
    const floaters = document.getElementById('floaters');
    const hearts = ["💗","💖","💕","💘","💝","💞"];
    for (let i = 0; i < 18; i++){
      const s = document.createElement('div');
      s.className = 'floater';
      s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      s.style.left = (Math.random()*100) + 'vw';
      const duration = 10 + Math.random()*14;
      s.style.animationDuration = duration + 's';
      s.style.animationDelay = (-Math.random()*duration) + 's';
      s.style.fontSize = (14 + Math.random()*18) + 'px';
      floaters.appendChild(s);
    }
  </script>
</body>
</html>
